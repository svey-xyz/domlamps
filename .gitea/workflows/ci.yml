# Gitea Actions understands GitHub Actions syntax; this mirrors .github/workflows/ci.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
        working-directory: packages/domlamps
      - run: npm run test:browser
      - run: npm run build
      - run: npm run lint:pkg -w domlamps
